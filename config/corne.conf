# OLED core
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# Keep RGB from cutting OLED power
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n


# ---------------------------
# LEFT / CENTRAL
# ---------------------------

# Show active layer
CONFIG_NICE_OLED_WIDGET_LAYER=y

# Keep WPM available for now
CONFIG_NICE_OLED_WIDGET_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM_NUMBER=y

# Disable the gauge/animation clutter
CONFIG_NICE_OLED_WIDGET_WPM_SPEEDOMETER=n
CONFIG_NICE_OLED_WIDGET_WPM_GRAPH=n
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=n
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=n


# ---------------------------
# RIGHT / PERIPHERAL
# ---------------------------

# Use animation
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=y

# Disable default cat
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=n

# Space-themed built-in animation
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SPACEMAN=y

# Local battery-oriented peripheral widget
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SMART_BATTERY=n
